<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kostenkurven verstehen</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#17283d;font:17px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}h2{font-size:23px}small{color:#526579}.panel{background:white;border:1px solid #d5dfe8;border-radius:16px;padding:clamp(15px,3vw,30px);margin-top:18px}button{font:inherit;border:1px solid #b7c9dc;border-radius:10px;background:white;color:#17334e;padding:12px 17px;cursor:pointer;text-align:left}button:hover{background:#edf5ff}button:focus-visible{outline:3px solid #e79b24}button:disabled{cursor:default;opacity:.75}.primary{background:#174d80;color:white;border:0}.primary:hover{background:#123c65}.choices{display:grid;gap:10px;margin:18px 0}.bar{height:8px;background:#dce6ee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#276db0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.good{background:#e2f3e8!important;border-color:#27834e!important}.bad{background:#fbe8e6!important;border-color:#ba5149!important}#feedback{padding:12px;border-radius:8px;margin:12px 0;line-height:1.5}svg{width:100%;height:auto;display:block;touch-action:manipulation}svg text{font-family:system-ui;fill:#34465b}svg .target{cursor:pointer}svg .target:focus{outline:none;stroke:#e79b24;stroke-width:4}footer{font-size:13px;color:#526579;margin-top:20px} [hidden]{display:none!important}
</style><main><small>WIRTSCHAFTSMATHEMATIK · KLASSE 11</small><h1>Ertragsgesetzliche Kostenfunktion</h1><p>Erkennen, markieren und beschreiben. Du brauchst keinen Taschenrechner.</p><div class="row"><span id="progress"></span><span id="score"></span></div><div class="bar"><i id="bar"></i></div><section class="panel" id="panel"><small id="kind"></small><h2 id="question"></h2><p id="instruction"></p><div id="graph"></div><div id="choices" class="choices"></div><div id="feedback" role="status" aria-live="polite" hidden></div><div class="row"><button id="restart">Neu starten</button><button id="next" class="primary" hidden>Weiter →</button></div></section><footer>Alle Diagramme sind schematische Lernbeispiele. Keine Anmeldung, keine Internetverbindung erforderlich.</footer></main><script>
const $=id=>document.getElementById(id);
// K(t)=2+1.1t+0.055(t-5)^3+6.875; shifted to K(0)=2, positive slope.
const K=t=>2+0.34*t+0.035*((t-5)**3+125);const X=t=>65+t*52,Y=k=>350-k*23;
const qs=[
{g:'point',q:'Markiere die Fixkosten im Graphen.',a:0,e:'Fixkosten fallen auch an, wenn nichts produziert wird. Du erkennst sie am Schnittpunkt der Gesamtkostenkurve mit der senkrechten Achse.'},
{q:'Was sind Fixkosten?',o:['Kosten, die unabhängig von der Produktionsmenge anfallen.','Kosten für jede zusätzlich produzierte Einheit.','Kosten, die nur bei hoher Produktion entstehen.'],a:0,e:'Zum Beispiel die monatliche Miete für eine Produktionshalle.'},
{g:'region',q:'Markiere den degressiven Kostenbereich.',a:0,e:'Vor der Kostenkehre steigt die Kurve immer langsamer. Die zusätzlichen Kosten je weiterer Einheit nehmen ab.'},
{q:'Was bedeutet degressiver Kostenverlauf?',o:['Die Gesamtkosten sinken.','Die Gesamtkosten steigen immer langsamer.','Die Gesamtkosten steigen immer schneller.'],a:1,e:'Degressiv bedeutet nicht sinkend. Die Kosten steigen weiter, aber die Kurve wird flacher.'},
{g:'point',q:'Markiere die Kostenkehre (Wendepunkt).',a:5,e:'Hier wechselt der Verlauf von degressiv zu progressiv. Die Kurve ist hier am flachsten.'},
{g:'region',q:'Markiere den progressiven Kostenbereich.',a:1,e:'Nach der Kostenkehre wird die Kurve zunehmend steiler. Die zusätzlichen Kosten je weiterer Einheit nehmen zu.'},
{q:'Was bedeutet progressiver Kostenverlauf?',o:['Die Kosten bleiben gleich.','Die Kosten steigen immer langsamer.','Die Kosten steigen immer schneller.'],a:2,e:'Die Kosten für weitere Produktionseinheiten werden zunehmend höher.'},
{g:'axes',q:'Welche Achse zeigt die Produktionsmenge?',a:0,e:'Die waagerechte Achse zeigt die Menge in Mengeneinheiten (ME). Die senkrechte Achse zeigt Kosten in Geldeinheiten (GE).'},
{g:'costs',q:'Markiere bei der eingezeichneten Produktionsmenge die variablen Kosten.',a:1,e:'Variable Kosten sind der Teil der Gesamtkosten oberhalb der Fixkosten. Sie hängen von der Produktionsmenge ab.'},
{g:'costs',q:'Markiere bei der eingezeichneten Produktionsmenge die gesamten Kosten.',a:2,e:'Gesamtkosten bestehen aus Fixkosten und variablen Kosten. Die gesamte Höhe vom Boden bis zur Kostenkurve stellt sie dar.'},
{q:'Welche Aussage über die Kostenkehre stimmt?',o:['Die Gesamtkosten sind dort am niedrigsten.','Dort wechselt der Kostenverlauf von degressiv zu progressiv.','Dort verschwinden die Fixkosten.'],a:1,e:'Die Kostenkehre ist kein Tiefpunkt der Gesamtkosten. Die Kurve steigt weiterhin.'},
{q:'Ein Betrieb produziert mehr. Die Maschinen sind gut ausgelastet und jede weitere Einheit verursacht weniger zusätzliche Kosten. Wie heißt dieser Verlauf?',o:['Progressiv','Linear','Degressiv'],a:2,e:'Abnehmende zusätzliche Kosten sind typisch für einen degressiven Verlauf.'},
{q:'Bei sehr hoher Auslastung entstehen zunehmend teure Überstunden. Jede weitere Einheit verursacht höhere zusätzliche Kosten. Wie heißt dieser Verlauf?',o:['Progressiv','Degressiv','Konstant'],a:0,e:'Zunehmende zusätzliche Kosten sind typisch für einen progressiven Verlauf.'},
{g:'curves',q:'Welche Kurve zeigt einen ertragsgesetzlichen Kostenverlauf?',a:1,e:'Die ertragsgesetzliche Kostenkurve steigt zunächst degressiv und anschließend progressiv.'},
{q:'Welche Beschreibung passt zum gesamten ertragsgesetzlichen Kostenverlauf?',o:['Zuerst progressiv, danach degressiv.','Die Kosten steigen immer gleich schnell.','Zuerst degressiv, danach progressiv.'],a:2,e:'Die Kosten steigen zuerst immer langsamer, erreichen die Kostenkehre und steigen danach immer schneller.'},
{g:'tangents',q:'Markiere den Berührpunkt der Geraden, die das Betriebsminimum zeigt.',a:0,e:'Die Gerade vom Fixkostenpunkt berührt die Kurve beim Betriebsminimum. Dort sind die variablen Stückkosten am niedrigsten.'},
{g:'tangents',q:'Markiere den Berührpunkt der Geraden, die das Betriebsoptimum zeigt.',a:1,e:'Die Gerade vom Ursprung berührt die Kurve beim Betriebsoptimum. Dort sind die gesamten Stückkosten am niedrigsten.'},
{q:'Was ist der Unterschied zwischen Betriebsminimum und Betriebsoptimum?',o:['Beim Betriebsminimum sind variable Stückkosten, beim Betriebsoptimum gesamte Stückkosten am niedrigsten.','Beim Betriebsminimum sind Fixkosten, beim Betriebsoptimum Gesamtkosten am niedrigsten.','Beide Begriffe bezeichnen die Kostenkehre.'],a:0,e:'Die beiden Begriffe beziehen sich auf Kosten pro Stück, nicht auf die niedrigsten Gesamtkosten.'}
];
let i=0,score=0,locked=false,errors=[];let order=[...qs];
const line=(x,y,x2,y2,attr='')=>`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" ${attr}/>`;
const txt=(x,y,s,attr='')=>`<text x="${x}" y="${y}" font-size="15" ${attr}>${s}</text>`;
const path=(f,a=0,b=10)=>Array.from({length:101},(_,j)=>{let t=a+(b-a)*j/100;return `${j?'L':'M'}${X(t)},${Y(f(t))}`}).join(' ');
const target=(n,shape,label)=>`<g class="target" tabindex="0" role="button" aria-label="${label}" data-n="${n}">${shape}</g>`;
const dot=(t,n,label)=>target(n,`<circle cx="${X(t)}" cy="${Y(K(t))}" r="12" fill="white" stroke="#174d80" stroke-width="3"/>`,label);
function graph(g){let s='';if(g==='curves'){s=[t=>2+1.2*t,K,t=>2+.16*t*t].map((f,j)=>{let d=Array.from({length:81},(_,k)=>{let t=k/8;return `${k?'L':'M'}${22+j*205+t*16},${235-f(t)*10}`}).join(' ');return target(j,`<rect x="${j*205+5}" y="25" width="198" height="245" rx="10" fill="#f3f7fb" stroke="#c1cedb"/>${line(22+j*205,235,190+j*205,235,'stroke="#526579"')}${line(22+j*205,235,22+j*205,40,'stroke="#526579"')}<path d="${d}" fill="none" stroke="#174d80" stroke-width="3"/>${txt(100+j*205,258,['A','B','C'][j],'text-anchor="middle"')}`,`Kurve ${['A','B','C'][j]}`)}).join('');return `<svg viewBox="0 0 620 280">${s}</svg>`}
for(let t=0;t<=10;t++)s+=line(X(t),40,X(t),350,'stroke="#e4ebf1"');for(let k=0;k<=14;k+=2)s+=line(65,Y(k),585,Y(k),'stroke="#e4ebf1"');
s+=line(65,350,610,350,'stroke="#34465b" stroke-width="2"')+line(65,350,65,22,'stroke="#34465b" stroke-width="2"')+txt(60,17,g==='axes'?'?':'Kosten (GE)')+txt(610,383,g==='axes'?'?':'Produktionsmenge (ME)','text-anchor="end"')+txt(52,369,'0');
s+=`<path d="${path(K)}" fill="none" stroke="#174d80" stroke-width="4"/>`+txt(585,Y(K(10))-9,'K','font-weight="bold"');
if(g==='point')s+=[0,2.5,5,7.5,10].map(t=>dot(t,t,`Punkt bei Position ${t}`)).join('');
if(g==='region'){for(let j=0;j<2;j++){let a=j*5,b=a+5;s+=target(j,`<rect x="${X(a)+3}" y="40" width="254" height="307" fill="${j?'#dbeafe':'#e2e8f0'}" fill-opacity=".28" stroke="#829ab1" stroke-dasharray="5 5"/><path d="${path(K,a,b)}" stroke="#174d80" stroke-width="5" fill="none"/>${txt(X(a+2.5),330,`Bereich ${j?'B':'A'}`,'text-anchor="middle"')}`,`Bereich ${j?'B':'A'}`)}}
if(g==='axes'){s+=target(0,`<rect x="100" y="350" width="490" height="34" fill="#dbeafe" fill-opacity=".5"/>${txt(330,373,'Achse A','text-anchor="middle"')}`,'Achse A');s+=target(1,`<rect x="7" y="40" width="54" height="300" fill="#dbeafe" fill-opacity=".5"/>${txt(29,190,'B','text-anchor="middle"')}`,'Achse B')}
if(g==='costs'){let x=8,y=Y(K(x)),f=Y(K(0)),xx=X(x);s+=line(65,f,585,f,'stroke="#829ab1" stroke-dasharray="5 5"')+line(xx,y,xx,350,'stroke="#829ab1" stroke-dasharray="5 5"');[[350,f,xx-24,'A'],[f,y,xx-24,'B'],[350,y,xx+35,'C']].forEach(([a,b,z,l],j)=>{s+=target(j,`<rect x="${z-16}" y="${b-4}" width="32" height="${a-b+8}" rx="5" fill="#e0ebf5" stroke="#50779a"/>${line(z,a,z,b,'stroke="#174d80" stroke-width="3"')}${txt(z,(a+b)/2+5,l,'text-anchor="middle" font-weight="bold"')}`,`Strecke ${l}`)})}
if(g==='tangents'){let bm=7.5;let bo=8;for(let t=7.5;t<10;t+=.001){if(t*(.34+.105*(t-5)**2)>=K(t)){bo=t;break}}s+=line(X(0),Y(K(0)),X(bm),Y(K(bm)),'stroke="#b46b20" stroke-width="2.5" stroke-dasharray="6 3"')+line(X(0),Y(0),X(bo),Y(K(bo)),'stroke="#25816e" stroke-width="2.5" stroke-dasharray="6 3"')+dot(bm,0,'Linker Berührpunkt')+dot(bo,1,'Rechter Berührpunkt')}
return `<svg viewBox="0 0 630 395" aria-label="Diagramm einer Kostenfunktion">${s}</svg>`}
function show(){locked=false;let q=order[i];$('progress').textContent=`Aufgabe ${i+1} von ${order.length}`;$('score').textContent=`${score} Punkte`;$('bar').style.width=`${i/order.length*100}%`;$('kind').textContent=i>=15?'VERTIEFUNG · STÜCKKOSTEN':q.g?'GRAPHIKAUFGABE':'BEGRIFFSTRAINING';$('question').textContent=q.q;$('instruction').textContent=q.g?'Tippe oder klicke auf die passende Markierung.':'Wähle die richtige Antwort.';$('graph').innerHTML=q.g?graph(q.g):'';$('choices').innerHTML='';$('feedback').hidden=true;$('next').hidden=true;if(q.o)q.o.forEach((o,n)=>{let b=document.createElement('button');b.textContent=o;b.dataset.n=n;b.onclick=()=>answer(n);$('choices').append(b)});$('graph').querySelectorAll('[data-n]').forEach(el=>{el.onclick=()=>answer(+el.dataset.n);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();answer(+el.dataset.n)}}})}
function answer(n){if(locked)return;locked=true;let q=order[i],ok=n===q.a;if(ok)score++;else errors.push(q);$('score').textContent=`${score} Punkte`;$('panel').querySelectorAll('[data-n]').forEach(el=>{let v=+el.dataset.n;if(el.tagName==='BUTTON'){el.disabled=true;if(v===q.a)el.classList.add('good');else if(v===n)el.classList.add('bad')}else{if(v===q.a||v===n){el.querySelectorAll('circle,rect').forEach(c=>{c.setAttribute('stroke',v===q.a?'#27834e':'#ba5149');c.setAttribute('fill',v===q.a?'#b9edca':'#f6c1bb');c.setAttribute('stroke-width','4')})}}});$('feedback').className=ok?'good':'bad';$('feedback').textContent=(ok?'Richtig! ':'Noch nicht ganz. ')+q.e;$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=i===order.length-1?'Auswertung':'Weiter →'}
function finish(){$('progress').textContent='Abgeschlossen';$('bar').style.width='100%';$('kind').textContent='AUSWERTUNG';$('question').textContent=`${score} von ${order.length} richtig`;$('instruction').textContent=errors.length?'Du kannst deine Fehler gezielt wiederholen.':'Alle Aufgaben richtig beantwortet!';$('graph').innerHTML='';$('choices').innerHTML='';$('feedback').hidden=true;$('next').hidden=true;if(errors.length){let b=document.createElement('button');b.textContent='Fehler wiederholen';b.onclick=()=>{order=[...errors];i=score=0;errors=[];show()};$('choices').append(b)}}
$('next').onclick=()=>{if(++i<order.length)show();else finish()};$('restart').onclick=()=>{order=[...qs];i=score=0;errors=[];show()};show();
</script></html>
